AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'lambda-nodejs24.x

  Sample SAM Template for lambda-nodejs24.x

  '
Globals:
  Function:
    Timeout: 30

Resources:

  SharpLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: sharp-layer
      Description: Sharp image processing for Linux
      ContentUri: layers/sharp/nodejs/
      CompatibleRuntimes:
        - nodejs20.x
      CompatibleArchitectures:
        - x86_64
    Metadata:
      BuildMethod: nodejs20.x

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: utils-layer
      Description: Util functions
      ContentUri: layers/utils/nodejs/
      CompatibleRuntimes:
        - nodejs20.x
      CompatibleArchitectures:
        - x86_64
    Metadata:
      BuildMethod: nodejs20.x

  UploadLibraryImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./handlers/upload-library-image
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Layers:
        - !Ref SharpLayer
        - !Ref UtilsLayer
      Events:
        UploadLibraryImage:
          Type: Api
          Properties:
            Path: /image-library
            Method: post
    Metadata:
      SamResourceId: UploadLibraryImageFunction
      
